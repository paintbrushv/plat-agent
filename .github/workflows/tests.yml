name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,intake]"
      - name: Run mocked test suite (offline, no secrets)
        env:
          # keep the suite offline and credential-free in CI
          UNDERWRITING_AZURE_ENDPOINT: ""
          UNDERWRITING_MCP_CMD: ""
          PLAT_COSTMODEL_CMD: ""
        run: |
          pytest tests/ -q